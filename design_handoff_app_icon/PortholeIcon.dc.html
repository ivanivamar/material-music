<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 1024 1024" width="{{ size }}" height="{{ size }}" style="display:block;">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17171A"></stop><stop offset="1" stop-color="#08080A"></stop></linearGradient>
    <linearGradient id="phRim" x1="0.15" y1="0.1" x2="0.85" y2="0.9"><stop offset="0" stop-color="#7C7C82"></stop><stop offset="0.45" stop-color="#2E2E32"></stop><stop offset="0.72" stop-color="#232326"></stop><stop offset="1" stop-color="#505056"></stop></linearGradient>
    <linearGradient id="phEdgeO" x1="0.15" y1="0.1" x2="0.85" y2="0.9"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"></stop><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.14"></stop></linearGradient>
    <linearGradient id="phEdgeI" x1="0.15" y1="0.1" x2="0.85" y2="0.9"><stop offset="0" stop-color="#000000" stop-opacity="0.7"></stop><stop offset="0.5" stop-color="#000000" stop-opacity="0.2"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.22"></stop></linearGradient>
    <linearGradient id="phGlass" x1="0" y1="184" x2="0" y2="840" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#35373C"></stop><stop offset="0.55" stop-color="#131416"></stop><stop offset="1" stop-color="#060607"></stop></linearGradient>
    <linearGradient id="phRay" x1="0" y1="184" x2="0" y2="840" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.11"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
    <linearGradient id="phRefl" x1="0" y1="608" x2="0" y2="760" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
    <filter id="phGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="11" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
    <filter id="phSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"></feGaussianBlur></filter>
    <clipPath id="phGl"><circle cx="512" cy="512" r="328"></circle></clipPath>
    <clipPath id="{{ cid }}"><rect width="1024" height="1024" rx="{{ rx }}"></rect></clipPath>
  </defs>
  <g clip-path="url(#{{ cid }})">
    <rect width="1024" height="1024" fill="url(#phBg)"></rect>
    <circle cx="512" cy="522" r="452" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="20" filter="url(#phSoft)"></circle>
    <circle cx="512" cy="512" r="405" fill="none" stroke="url(#phRim)" stroke-width="94"></circle>
    <circle cx="512" cy="512" r="450" fill="none" stroke="url(#phEdgeO)" stroke-width="4"></circle>
    <circle cx="512" cy="512" r="360" fill="none" stroke="url(#phEdgeI)" stroke-width="4"></circle>
    <path d="{{ rivets }}" fill="#000000" fill-opacity="0.55" transform="translate(0 5)"></path>
    <path d="{{ rivets }}" fill="#6C6C72"></path>
    <path d="{{ rivetHi }}" fill="#FFFFFF" fill-opacity="0.55"></path>
    <circle cx="512" cy="512" r="343" fill="none" stroke="#050506" stroke-width="30"></circle>
    <g clip-path="url(#phGl)">
      <rect x="184" y="184" width="656" height="656" fill="url(#phGlass)"></rect>
      <path d="M392 184 L470 184 L410 840 L300 840 Z" fill="url(#phRay)"></path>
      <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
        <path d="M560 184 L596 184 L640 840 L540 840 Z" fill="url(#phRay)" opacity="0.7"></path>
        <circle cx="362" cy="332" r="6" fill="#FFFFFF" fill-opacity="0.45"></circle>
        <circle cx="676" cy="404" r="5" fill="#FFFFFF" fill-opacity="0.35"></circle>
        <circle cx="664" cy="700" r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="4"></circle>
        <circle cx="684" cy="660" r="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"></circle>
      </sc-if>
      <path d="{{ bars }}" fill="#FFFFFF" filter="url(#phGlow)"></path>
      <path d="{{ refl }}" fill="url(#phRefl)"></path>
      <circle cx="512" cy="512" r="328" fill="none" stroke="#000000" stroke-opacity="0.75" stroke-width="40" filter="url(#phSoft)"></circle>
    </g>
    <path d="M234 411 A296 296 0 0 1 411 234" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="{{ hiW }}" stroke-linecap="round"></path>
    <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
      <path d="M451 223 A296 296 0 0 1 491 217" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="16" stroke-linecap="round"></path>
    </sc-if>
  </g>
  <rect x="2" y="2" width="1020" height="1020" rx="{{ rx2 }}" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"></rect>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:512,&quot;height&quot;:512},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:512,&quot;tsType&quot;:&quot;number&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;small&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full'|'small'&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;squircle&quot;,&quot;circle&quot;],&quot;default&quot;:&quot;squircle&quot;,&quot;tsType&quot;:&quot;'squircle'|'circle'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    if (!this._u) this._u = 'phc' + Math.random().toString(36).slice(2, 8);
    const small = this.props.variant === 'small', round = this.props.shape === 'circle';
    const key = (small ? 's' : 'f');
    if (!this._g || this._g.key !== key) {
      const circ = (x, y, r) => `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
      const n = small ? 8 : 12, rr = small ? 26 : 17;
      let rivets = '', rivetHi = '';
      for (let k = 0; k < n; k++) {
        const a = k / n * Math.PI * 2 - Math.PI / 2;
        const x = Math.round(512 + 405 * Math.cos(a)), y = Math.round(512 + 405 * Math.sin(a));
        rivets += circ(x, y, rr); rivetHi += circ(x - Math.round(rr * 0.32), y - Math.round(rr * 0.32), Math.round(rr * 0.36));
      }
      const hs = small ? [128, 232, 320, 208, 112] : [64, 112, 176, 256, 320, 240, 160, 104, 56];
      const w = small ? 56 : 28, gap = small ? 36 : 20, base = small ? 600 : 596, rg = small ? 20 : 16, rk = small ? 0.35 : 0.42;
      const x0 = 512 - (hs.length * w + (hs.length - 1) * gap) / 2;
      let bars = '', refl = '';
      hs.forEach((h, i) => { const x = x0 + i * (w + gap); bars += `M${x} ${base}h${w}v${-h}h${-w}Z`; refl += `M${x} ${base + rg}h${w}v${Math.round(h * rk)}h${-w}Z`; });
      this._g = { key, rivets, rivetHi, bars, refl };
    }
    const rx = round ? 512 : 236;
    return { size: this.props.size ?? 512, cid: this._u, rx, rx2: rx - 2, full: !small, hiW: small ? 28 : 16, ...this._g };
  }
}
</script>
</body>
</html>
