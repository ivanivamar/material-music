# Pelagic web app + /api function → Firebase (the only hosting since Oct 20, 2026; Cloudflare Pages retired).
#   hosting:   app/ → npm run build → app/dist → Firebase Hosting (live channel)
#   functions: firebase/functions (sign-in helper, Deezer proxy, DJ voice) → Cloud Function `api`
# Each job only runs when its files changed (both on a manual run).
#
# Secret (repo → Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT   JSON key of the deploy service account. Roles:
#     Hosting:   Firebase Hosting Admin, Cloud Run Viewer, Cloud Functions Viewer, API Keys Viewer
#     Functions: Cloud Functions Admin, Cloud Run Admin, Service Account User,
#                Secret Manager Viewer, Artifact Registry Administrator, Service Usage Consumer
# The Firebase project id comes from .firebaserc.
name: Firebase

on:
  push:
    branches: [main]
    paths: ['app/**', 'firebase/**', 'firebase.json', '.firebaserc', '.github/workflows/firebase.yml']
  workflow_dispatch:

concurrency:
  group: firebase
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      hosting: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.hosting == 'true' }}
      functions: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.functions == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hosting:
              - 'app/**'
              - 'firebase.json'
              - '.firebaserc'
              - '.github/workflows/firebase.yml'
            functions:
              - 'firebase/functions/**'
              - 'firebase.json'
              - '.firebaserc'
              - '.github/workflows/firebase.yml'

  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install function dependencies
        run: npm --prefix firebase/functions ci

      - name: Typecheck
        run: npm --prefix firebase/functions run typecheck

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # predeploy (firebase.json) bundles src → lib with esbuild. --force lets the CLI set the
      # Artifact Registry cleanup policy without asking.
      - name: Deploy the api function
        run: npx --yes firebase-tools@latest deploy --only functions --non-interactive --force

  hosting:
    needs: [changes, functions]
    # after the function (when it ran), so a new /api route exists before the page that calls it
    if: always() && needs.changes.outputs.hosting == 'true' && needs.functions.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the web app
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
